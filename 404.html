<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Jismy Thomas</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#12263F">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F4F3EF;--ink:#12171A;--slate:#57626B;--blue:#1D4E77;--amber:#C08A2E;--line:#D6D3CA}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;padding:2rem;text-align:center}
  .code{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
  h1{font-weight:600;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.022em;margin:.9rem 0 0}
  p{color:var(--slate);margin:1rem auto 0;max-width:28rem;line-height:1.6;font-size:.98rem}
  .axis{height:14px;width:220px;margin:1.8rem auto;background:
    repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 28px) bottom/auto 8px no-repeat,
    linear-gradient(var(--line),var(--line)) bottom/100% 1px no-repeat}
  .btn{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.76rem;letter-spacing:.08em;
    text-transform:uppercase;padding:.82rem 1.35rem;text-decoration:none;border-radius:3px;
    border:1px solid var(--blue);background:var(--blue);color:#fff}
  .btn:hover{background:#12263F;border-color:#12263F}
</style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>That page isn't here.</h1>
    <div class="axis"></div>
    <p>The link may be out of date, or the address mistyped. Everything on this site lives on the one page.</p>
    <p style="margin-top:1.6rem"><a class="btn" href="/">Back to jismy.in</a></p>
  </main>
</body>
</html>
